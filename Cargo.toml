[package]
name = "agy-auth-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
default-run = "agy-auth-rust"
description = "Native Rust Antigravity CLI and Desktop multi-account manager with real-time quota dashboard"
repository = "https://github.com/deactivated0/agy-auth-rust"
homepage = "https://github.com/deactivated0/agy-auth-rust"
readme = "README.md"
keywords = ["antigravity", "gemini", "oauth2", "tui", "account-switcher"]
categories = ["command-line-utilities", "development-tools"]
authors = ["deactivated0 <deactivated0@users.noreply.github.com>"]

[[bin]]
name = "agy-auth-rust"
path = "src/main.rs"

[[bin]]
name = "agy-switch"
path = "src/switch.rs"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "5.0"
fs2 = "0.4"
keyring = "2.3"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
url = "2.5"
uuid = { version = "1.10", features = ["v4"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3

[profile.dev]
opt-level = 0

[profile.small]
inherits = "release"
opt-level = "z"
